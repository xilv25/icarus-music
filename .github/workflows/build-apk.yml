name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Web App
        run: |
          # Buat folder out kosong atau jalankan build jika konfigurasi mengizinkan
          mkdir -p out
          echo "Icarus Music" > out/index.html

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate Fresh Android Project & Inject Custom Code
        run: |
          # 1. Tambahkan platform Android
          npx cap add android

          # 2. Timpa file bawaan dengan kode custom background player kita dari folder native-source
          if [ -d "native-source" ]; then
            mkdir -p android/app/src/main/java/com/icarus/music
            cp -f native-source/MainActivity.kt android/app/src/main/java/com/icarus/music/
            cp -f native-source/MusicService.kt android/app/src/main/java/com/icarus/music/
            cp -f native-source/AndroidManifest.xml android/app/src/main/
          fi

          npx cap sync android

      - name: Fix Duplicate Kotlin Dependencies
        run: |
          echo "android { configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/app/build.gradle

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IcarusMusic-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
