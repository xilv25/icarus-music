name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Web App
        run: npm run build

      - name: Generate Fresh Android Project & Inject Custom Code
        run: |
          # 1. Hapus folder android lama
          rm -rf android

          # 2. Tambahkan platform Android
          npx cap add android

          # 3. Hapus MainActivity.java bawaan
          rm -f android/app/src/main/java/com/icarus/music/MainActivity.java

          # 4. Salin kode kustom dari folder native-source
          if [ -d "native-source" ]; then
            mkdir -p android/app/src/main/java/com/icarus/music
            cp -f native-source/MainActivity.kt android/app/src/main/java/com/icarus/music/
            cp -f native-source/MusicService.kt android/app/src/main/java/com/icarus/music/
            cp -f native-source/AndroidManifest.xml android/app/src/main/
          fi

          # 5. Sinkronisasi project
          npx cap sync android

      - name: Fix Namespace & Duplicate Kotlin Dependencies
        run: |
          echo "android { namespace 'com.icarus.music'; configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/app/build.gradle

      - name: Build Android APK (Clean Build)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IcarusMusic-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
